# E2c amendment 2 (tasks/e2c_plan.md §12, 2026-10-07): STEP-MATCHED budget for the sensitivity set Cnf (= C minus flip_only).
# Same as configs/train_e2c.yaml except train.num_epochs 9, and every Cnf run is launched with --max-steps equal to the
# optimizer-step count of the SAME teacher's E2c-C run (gpt4o 780, claude46 760, deepseek_v4 395; from their manifests),
# so the cosine schedule and the number of updates are identical to C while the training set is the 932-family subset.
# Reason: at 5 epochs the smaller Cnf set gives only 435 steps for claude46 and its students reproduced 0.942-0.952 of
# their labels (gate >= 0.95). 9 epochs is just enough for the cap to bind for all three teachers (92/87/63 steps per epoch).

student_model: Qwen/Qwen3-4B-Base
student_model_short: qwen3-4b      # first path component under runs/

paths:
  prompts_train: data/prompts/train_prompts_v2.jsonl
  prompts_dev: data/prompts/dev_prompts_v2.jsonl
  prompts_test: data/prompts/test_prompts_v2.jsonl
  prompts_pilot: data/prompts/pilot_prompts_v2.jsonl   # smoke runs only (300 pilot items; demos in data/teacher_v2)
  teacher_dir: data/teacher_phase1  # {teacher}_train_demo.jsonl, {teacher}_{dev,test}_profile.jsonl
  rewrites_dir: data/rewrites_v9    # {teacher}/rewrites.jsonl
  sft_dir: data/sft                 # {teacher}_{version}_s{seed}.jsonl
  runs_dir: runs

teachers: [gpt4o, claude46, deepseek_v4]
versions: [O, F, C]
seeds: [1, 2, 3, 4, 5]
control_seeds: [1, 2, 3]            # random-label students R

data:
  paired: true                      # O / F / C of one teacher share the prompt_id set (intersection of kept rewrites)
  order_policy: stable_one          # protocol docs/02 §4.2: keep order-stable items, one seeded order per item; "both" keeps both orders
  variants: [T1, T3, T5, T6]        # training never sees T0

train:
  precision: bf16
  learning_rate: 1.0e-5
  lr_scheduler: cosine
  warmup_ratio: 0.03
  num_epochs: 9                     # amendment 2: upper bound; the per-teacher --max-steps cap (C's step count) binds
  per_device_batch_size: 4
  gradient_accumulation_steps: 8    # effective batch = 32 sequences on 1 GPU (docs/05 §3.2: 4 x 8, the pre-registered layout)
  max_seq_len: 1024
  gradient_checkpointing: true
  optimizer: adamw_torch            # fused CUDA AdamW; fallback adamw_8bit (bitsandbytes, Linux + CUDA only) if the gate run shows peak_memory_gib > 70
  weight_decay: 0.0
  max_grad_norm: 1.0
  loss_on: assistant                # labels = -100 on every prompt token
  save_strategy: final              # one checkpoint at the end; no eval during training
  logging_steps: 10
  attn_implementation: sdpa

readout:
  backend: transformers   # 2026-10-05: vLLM (top-20 logprobs) vs transformers differed by up to 0.06 on bf16; full-vocabulary softmax for every readout (auto = vllm if importable else transformers)
  top_logprobs: 20
  answer_mass_min: 0.9              # category "answer" iff P(" A"|"A") + P(" B"|"B") >= this
  dtype: float32   # 2026-10-05 Mac decision: fp32 readout removes the bf16 noise the gate measured (mean 0.007, max 0.06 in P(A)) at no cost; training stays bf16
  batch_size: 32

# CPU smoke profile for tests (tests/test_sft_smoke.py, tests/test_readout.py): `--profile tiny` overrides the keys below.
tiny:
  student_model: HuggingFaceTB/SmolLM2-135M
  student_model_short: smollm2-135m
  n_examples: 8
  max_steps: 2
  train:
    precision: fp32
    per_device_batch_size: 4
    gradient_accumulation_steps: 1
    max_seq_len: 256
    gradient_checkpointing: false
    attn_implementation: eager
  readout:
    backend: transformers
    dtype: float32
    batch_size: 4
