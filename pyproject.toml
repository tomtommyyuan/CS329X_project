[project]
name = "vcd"
version = "0.1.0"
description = "Value-consistency distillation experiments: E0 pilot tooling"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "pyyaml",
  "pydantic>=2",
  "openai>=1.60,<2",
  "anthropic>=1,<2",
  "httpx",
  "tqdm",
  "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest"]
# Student SFT stack (Phase 1). Install with: uv pip install -e ".[train]" --python .venv/bin/python
train = ["torch", "transformers>=4.45", "datasets", "accelerate", "safetensors", "sentencepiece", "protobuf"]
# Student readout on HAIC only (vLLM is Linux + CUDA); the transformers fallback needs only "train".
eval = ["vllm"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
